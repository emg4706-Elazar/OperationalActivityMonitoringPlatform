services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: operational_monitoring
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s


  station-loader:
    build:
      context: ./station-loader
      dockerfile: Dockerfile
    container_name: station-loader
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: operational_monitoring
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
      MYSQL_PORT: 3306
      DATA_FILE_PATH: /app/data/stations.csv

    volumes:
      - ./data:/app/data:ro

    depends_on:
      mysql:
        condition: service_healthy


  broker:
    image: apache/kafka:4.3.1
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      
      KAFKA_LISTENERS: "CONTROLLER://:29093,INTERNAL://:19092,EXTERNAL://:9092"

      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker:19092,EXTERNAL://localhost:9092"

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    
    healthcheck:
      test: 
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s


  kafka-init-readings:
    image: apache/kafka:4.3.1

    depends_on: 
      broker:
        condition: service_healthy

    entrypoint:
      - /opt/kafka/bin/kafka-topics.sh

    command:
      - --bootstrap-server
      - broker:19092
      - --create
      - --if-not-exists
      - --topic
      - activity-readings
      - --partitions
      - "1"
      - --replication-factor
      - "1"



  producer:
    build: 
      context: ./producer
      dockerfile: Dockerfile
    container_name: producer
    environment:
      DATA_FILE_PATH: /app/data/activity_readings.csv
      KAFKA_BOOTSTRAP_SERVERS: "broker:19092"
      KAFKA_TOPIC_NAME: activity-readings
      KAFKA_CLIENT_ID: "readings.producer"
      PUBLISH_DELAY_SECONDS: "0.1"

    volumes:
      - ./data:/app/data:ro

    depends_on:
      kafka-init-readings:
        condition: service_completed_successfully
      station-loader:
        condition: service_completed_successfully


  mongo:
    image: mongo:8.0.4
    container_name: mongo
    ports:
      - "27017:27017"
    
    volumes:
      - mongo-data:/data/db

    healthcheck:
      test: 
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  raw-consumer:
    build:
      context: ./raw-consumer
      dockerfile: Dockerfile
    container_name: raw-consumer
    environment:
      Kafka__BootstrapServers: "broker:19092"
      Kafka__GroupId: "operational-monitoring-group"
      Kafka__ClientId: "raw-consumer"
      Kafka__Topic: "activity-readings"

      Mongo__Uri: "mongodb://mongo:27017"
      Mongo__Database: "operational-monitoring"
      Mongo__Collection: "raw_readings"

    depends_on:
      kafka-init-readings:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy


  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "broker:19092"
      KAFKA_INPUT_TOPIC: "activity-readings"
      KAFKA_OUTPUT_TOPIC: "anomalies"
      KAFKA_GROUP_ID: "analitics-group"
      KAFKA_CLIENT_ID: "analitics-service"

      WINDOW_SIZE: "20"
      Z_THRESHOLD: "3.5"
      CRITICAL_THRESHOLD: "4.5"

    depends_on:
      kafka-init-readings:
        condition: service_completed_successfully
      kafka-init-anomalies:
        condition: service_completed_successfully


  kafka-init-anomalies:
    image: apache/kafka:4.3.1

    depends_on:
      broker:
        condition: service_healthy

    entrypoint:
      - /opt/kafka/bin/kafka-topics.sh

    command:
      - --bootstrap-server
      - broker:19092
      - --create
      - --if-not-exists
      - --topic
      - anomalies
      - --partitions
      - "1"
      - --replication-factor
      - "1"


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    container_name: elasticsearch

    ports:
      - "9200:9200"

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s


  rabbitmq:
    image: rabbitmq:4.3.6-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: secret

    volumes:
      - "rabbitmq-data:/var/lib/rabbitmq"
    

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-p", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4
    container_name: kibana
    ports:
      - "5601:5601"

    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'

    depends_on:
      elasticsearch:
        condition: service_healthy


  persistence-consumer:
    build:
      context: ./persistence-consumer
      dockerfile: Dockerfile
    container_name: persistence-consumer
    environment:
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "app"
      RabbitMq__Password: "secret"
      RabbitMq__QueueName: "alerts.critical"

      Kafka__BootstrapServers: "broker:19092"
      Kafka__Topic: "anomalies"
      Kafka__GroupId: "persistence-consumer-group"
      Kafka__ClientId: "persistence-consumer"

      MySql__ConnectionStrings: "Server=mysql;Port=3306;Database=operational_monitoring;User=root;Password=secret;"

      Elasticsearch__Url: http://elasticsearch:9200
      Elasticsearch__IndexName: anomalies


    depends_on:
      station-loader:
        condition: service_completed_successfully
        
      mysql:
        condition: service_healthy

      elasticsearch:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      kafka-init-anomalies:
        condition: service_completed_successfully


volumes:
  mysql-data:
  mongo-data:
  elasticsearch-data:
  rabbitmq-data: