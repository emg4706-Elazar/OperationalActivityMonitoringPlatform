services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: operational_monitoring
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s


  station-loader:
    build:
      context: .\station-loader
      dockerfile: Dockerfile
    container_name: station-loader
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: operational_monitoring
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
      MYSQL_PORT: 3306
      DATA_FILE_PATH: /app/data/stations.csv

    volumes:
      - ./data:/app/data:ro

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data: